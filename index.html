<title>Future Ads Digital | Marketing Digital e Tráfego Pago em Manaus</title>
<meta name="description" content="Agência de marketing digital e tráfego pago em Manaus. Redes sociais, SEO, Google Ads, sites e muito mais para sua marca alcançar resultados reais." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4c9 9 12 24 9 38H23C20 28 23 13 32 4z' fill='%234fd8ff'/%3E%3Cpath d='M23 34l-9 11 6 1 4-6zM41 34l9 11-6 1-4-6z' fill='%23c056ff'/%3E%3Ccircle cx='32' cy='22' r='5' fill='%230b1226' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #040b1f;
  --bg2: #0b1536;
  --cyan: #5cc8ff;
  --lilac: #4f8cff;
  --pink: #8fb4ff;
  --blue: #0a7bc2;
  --text: #e8eefc;
  --muted: rgba(232, 238, 252, 0.72);
  --glass: rgba(120, 170, 255, 0.09);
  --border: rgba(160, 200, 255, 0.22);
  --grad: linear-gradient(100deg, #8fe3ff, #4f8cff 58%, #9db8ff);
}
[hidden] { display: none !important; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; }
body {
  font-family: 'Sora', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  overflow-x: hidden;
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
ul { list-style: none; }

/* fundo animado */
.bg { position: fixed; inset: 0; z-index: -1; background: radial-gradient(ellipse at 20% 0%, #12307a 0%, var(--bg) 62%); overflow: hidden; }
.orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .45; animation: drift 18s ease-in-out infinite alternate; }
.o1 { width: 40vw; height: 40vw; background: #1f5cff; top: -10vw; right: -8vw; }
.o2 { width: 32vw; height: 32vw; background: #2a6bff; bottom: 5vh; left: -10vw; animation-delay: -6s; }
.o3 { width: 24vw; height: 24vw; background: #2fb8ff; bottom: -8vw; right: 15vw; opacity: .25; animation-delay: -11s; }
@keyframes drift { to { transform: translate(5vw, 6vh) scale(1.15); } }

.glass {
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: 22px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 10px 40px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .15);
}

/* header */
.header {
  position: sticky; top: 0; z-index: 50;
  width: 100%; margin: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px max(16px, calc((100% - 1180px) / 2));
  background: #061238; border-bottom: 1px solid var(--border);
  box-shadow: 0 10px 30px rgba(0, 4, 24, .55);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.brand img { width: 38px; height: 38px; border-radius: 50%; }
.brand b { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.nav { display: flex; align-items: center; gap: 26px; font-size: .92rem; }
.nav a:not(.btn) { color: var(--muted); position: relative; transition: color .2s; }
.nav a:not(.btn):hover { color: #fff; }
.nav a:not(.btn)::after { content: ''; position: absolute; left: 0; bottom: -4px; height: 2px; width: 0; background: var(--grad); transition: width .25s; }
.nav a:not(.btn):hover::after { width: 100%; }
.burger { display: none; background: none; border: 0; width: 40px; height: 40px; cursor: pointer; flex-direction: column; justify-content: center; align-items: center; gap: 6px; }
.burger span { width: 24px; height: 2px; background: #fff; border-radius: 2px; transition: .3s; }
.burger.on span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
.burger.on span:nth-child(2) { opacity: 0; }
.burger.on span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

/* botões */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 13px 26px; border-radius: 999px; border: 0; cursor: pointer;
  font: 600 .95rem 'Sora', sans-serif; color: #fff;
  background: linear-gradient(180deg, #1190e0, #0567a8);
  box-shadow: 0 6px 24px rgba(10, 123, 194, .5);
  transition: transform .2s, box-shadow .2s;
}
.btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(63, 208, 240, .5); }
.btn:hover svg { animation: nudge .6s infinite alternate; }
@keyframes nudge { to { transform: translateX(4px); } }
.btn-sm { padding: 9px 18px; font-size: .85rem; }
.btn-ghost { background: transparent; border: 1px solid var(--border); box-shadow: none; }

/* hero */
.hero {
  width: min(1180px, calc(100% - 32px)); margin: 0 auto; min-height: calc(100svh - 70px);
  display: grid; grid-template-columns: 1.1fr .9fr; align-items: center; gap: 24px; padding: 10px 0 8px;
}
.eyebrow { color: var(--cyan); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: .8rem; margin-bottom: 14px; }
h1 { font-size: clamp(2.3rem, min(8vw, 12.5vh), 5.5rem); line-height: 1.02; font-weight: 800; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 14px; }
.lead { color: var(--muted); font-size: clamp(1rem, 2vw, 1.15rem); max-width: 520px; margin-bottom: 20px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 14px; }
.hint { margin-top: 14px; color: var(--muted); font-size: .85rem; animation: blink 2s infinite; }
@keyframes blink { 50% { opacity: .35; } }

/* foguete 3D */
.hero-art { display: flex; justify-content: center; align-items: center; min-width: 0; }
.rocket-btn { display: block; background: none; border: 0; cursor: pointer; width: min(420px, 90%, 58vh); -webkit-tap-highlight-color: transparent; padding: 0; touch-action: manipulation; }
.scene { position: relative; display: block; width: 100%; aspect-ratio: 400 / 460; perspective: 1000px; }
.sway { position: absolute; inset: 0; display: block; transform-style: preserve-3d; animation: sway 9s ease-in-out infinite alternate; }
@keyframes sway { from { transform: rotateY(-8deg) rotateX(2deg); } to { transform: rotateY(8deg) rotateX(-1deg); } }
.stage { position: absolute; inset: 0; display: block; transform-style: preserve-3d; transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .25s ease-out; }
.stage > * { position: absolute; display: block; }

.floor { left: 50%; top: 51.5%; width: 84%; aspect-ratio: 1; border-radius: 50%; transform: translateX(-50%) rotateX(78deg); background: radial-gradient(circle, rgba(92,200,255,.45) 0, rgba(47,107,255,.28) 46%, rgba(47,107,255,0) 70%); box-shadow: 0 0 60px rgba(79,140,255,.45); }
.floor::before { content: ''; position: absolute; inset: 12%; border-radius: 50%; border: 2px solid rgba(127,227,255,.75); box-shadow: 0 0 18px rgba(92,200,255,.7), inset 0 0 18px rgba(92,200,255,.5); }
.floor::after { content: ''; position: absolute; inset: 27%; border-radius: 50%; border: 1px dashed rgba(127,227,255,.6); animation: spinz 18s linear infinite; }
.floor.deep { transform: translate3d(-50%, 10px, 0) rotateX(78deg); background: radial-gradient(circle, rgba(10,30,90,.9), rgba(10,30,90,0) 70%); box-shadow: none; }
.floor.deep::before, .floor.deep::after { display: none; }
@keyframes spinz { to { transform: rotate(360deg); } }

.orbit3d { left: 2%; top: 8%; width: 96%; aspect-ratio: 1; transform-style: preserve-3d; transform: rotateX(74deg); }
.orbit-spin { position: absolute; inset: 0; display: block; transform-style: preserve-3d; animation: spinz 11s linear infinite; }
.orbit-spin::before { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px dashed rgba(127,227,255,.5); box-shadow: 0 0 14px rgba(92,200,255,.35); }
.planet { position: absolute; left: 100%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: radial-gradient(circle at 42% 40%, #fff 0, #bff1ff 9%, #5cc8ff 17%, #2a6bff 27%, rgba(42,107,255,.35) 38%, rgba(42,107,255,0) 52%); animation: unspin 11s linear infinite; }
@keyframes unspin { from { transform: rotateZ(0deg) rotateX(-74deg); } to { transform: rotateZ(-360deg) rotateX(-74deg); } }

.rshadow { left: 50%; top: 82%; width: 30%; height: 5%; border-radius: 50%; background: rgba(0,0,0,.6); filter: blur(10px); transform: translate3d(-50%, 0, 2px); animation: shadow 3.2s ease-in-out infinite; }
@keyframes shadow { 50% { transform: translate3d(-50%, 0, 2px) scale(.78); opacity: .6; } }
.rocket3d { left: 50%; bottom: 14%; width: 46%; transform: translate3d(-50%, 0, 50px); animation: rfloat 3.2s ease-in-out infinite; }
@keyframes rfloat { 50% { transform: translate3d(-50%, -14px, 50px); } }
.rocket-svg { display: block; width: 100%; height: auto; overflow: visible; position: relative; transition: transform .4s; }
.rocket-btn:hover .rocket-svg { transform: scale(1.05) rotate(-2deg); }
.flame { transform-box: fill-box; transform-origin: 50% 0; animation: flame .14s ease-in-out infinite alternate; }
@keyframes flame { from { transform: scaleY(.85) scaleX(.95); } to { transform: scaleY(1.25) scaleX(1.06); } }
.dust { width: 4px; height: 4px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px 2px rgba(127,227,255,.8); transform: translateZ(var(--z, 0px)); animation: twinkle 2.6s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: .15; } }
.rocket-btn.launched .rocket3d { animation: launch 1.1s cubic-bezier(.6, 0, 1, .6) forwards; }
.rocket-btn.launched .flame { animation-duration: .06s; transform: scaleY(1.8); }
.rocket-btn.launched .rshadow { opacity: 0; }
@keyframes launchFlat { to { transform: translate3d(-50%, -130vh, 0); opacity: 0; } }
@media (hover: none), (max-width: 820px) { .rocket-btn.launched .rocket3d { animation: launchFlat 1.1s ease-in forwards; } }
@keyframes launch { to { transform: translate3d(-50%, -1000px, 140px) scale(.8); opacity: 0; } }

/* seções */
.section { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 34px 0; }
.grad-title { font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1.15; font-weight: 800; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 16px; }
.grad-title.small { font-size: 1.8rem; margin: 50px 0 20px; }
.center { text-align: center; }
.sub { color: var(--muted); margin-bottom: 22px; }

/* quem somos */
.about { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; align-items: stretch; }
.about-card { padding: clamp(24px, 4vw, 48px); }
.about-card p { color: var(--muted); margin-bottom: 26px; font-size: 1.05rem; }
.stats { display: grid; gap: 16px; }
.stat { padding: 22px 26px; display: flex; align-items: center; gap: 18px; transition: transform .3s; }
.stat:hover { transform: translateX(8px); }
.stat strong { font-size: 2.2rem; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stat span { color: var(--muted); }

/* cards de serviço */
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.card {
  padding: 28px 22px; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden;
  transition: transform .3s, border-color .3s, box-shadow .3s;
  animation: rise .7s both; animation-delay: var(--d, 0s);
}
@keyframes rise { from { opacity: 0; transform: translateY(30px); } }
.card::before { content: ''; position: absolute; inset: 0; background: var(--grad); opacity: 0; transition: opacity .3s; z-index: -1; }
.card:hover { transform: translateY(-8px); border-color: var(--cyan); box-shadow: 0 18px 50px rgba(63, 208, 240, .25); }
.card h3 { font-size: 1.05rem; }
.card p { color: var(--muted); font-size: .88rem; flex: 1; }
.more { display: inline-flex; align-items: center; gap: 6px; color: var(--cyan); font-size: .85rem; font-weight: 600; }
.card:hover .more svg { animation: nudge .6s infinite alternate; }
.svc-icon { width: 64px; height: 64px; margin-bottom: 6px; overflow: visible; transition: transform .3s; }
.card:hover .svc-icon { transform: scale(1.15) rotate(-5deg); }
.g4 { grid-template-columns: repeat(4, 1fr); }
.g4 .card { text-align: center; align-items: center; }

/* animações dos ícones */
.ic-heart { transform-box: fill-box; transform-origin: center; animation: beat 1.4s ease-in-out infinite; }
@keyframes beat { 50% { transform: scale(1.3); } }
.ic-search { animation: scan 3s ease-in-out infinite; }
@keyframes scan { 50% { transform: translate(5px, 4px); } }
.ic-draw, .ic-line { stroke-dasharray: 40; animation: draw 2.6s ease-in-out infinite; }
.l2 { animation-delay: .3s; } .l3 { animation-delay: .6s; }
@keyframes draw { 0% { stroke-dashoffset: 40; } 50%, 100% { stroke-dashoffset: 0; } }
.ic-pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.35); opacity: .6; } }
.ic-flap { transform-box: fill-box; transform-origin: top; animation: flap 3s ease-in-out infinite; }
@keyframes flap { 50% { transform: scaleY(.6); } }
.ic-horn { transform-box: fill-box; transform-origin: left center; animation: horn 1.6s ease-in-out infinite; }
@keyframes horn { 50% { transform: rotate(-6deg); } }
.ic-wave { animation: wave 1.6s ease-in-out infinite; }
.w2 { animation-delay: .25s; }
@keyframes wave { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
.ic-code { animation: code 2s ease-in-out infinite alternate; }
.ic-code.l { --x: -3px; } .ic-code.r { --x: 3px; }
@keyframes code { to { transform: translateX(var(--x)); } }
.ic-bar { transform-box: fill-box; transform-origin: bottom; animation: bar 2.2s ease-in-out infinite; }
.b2 { animation-delay: .2s; } .b3 { animation-delay: .4s; }
@keyframes bar { 50% { transform: scaleY(.55); } }

/* clientes */
.marquee { background: linear-gradient(135deg, #343a4a, #7d8494); border-radius: 28px; padding: 22px 0; overflow: hidden; mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); }
.track { display: flex; gap: 28px; width: max-content; animation: marquee 28s linear infinite; padding: 10px 0; }
.marquee:hover .track { animation-play-state: paused; }
@keyframes marquee { to { transform: translateX(-50%); } }
.client { width: 130px; height: 130px; flex: none; border-radius: 50%; background: transparent; display: grid; place-items: center; overflow: hidden; border: 0; box-shadow: 0 6px 18px rgba(0,0,0,.35); transition: transform .3s, box-shadow .3s; color: #fff; font-size: .7rem; text-align: center; padding: 0; }
.client:hover { transform: scale(1.12); box-shadow: 0 0 0 3px var(--cyan), 0 10px 26px rgba(92,200,255,.4); }
.client img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

/* contato */
.contact { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; }
.info-list { display: grid; gap: 16px; }
.info-list a, .info-list span { display: inline-flex; align-items: center; gap: 12px; color: var(--muted); transition: color .2s; }
.info-list a:hover { color: var(--cyan); }
.form { padding: clamp(22px, 4vw, 36px); display: grid; gap: 16px; }
.form h3 { font-size: 1.3rem; }
.form label { display: grid; gap: 6px; font-size: .85rem; color: var(--muted); }
.form input, .form textarea { font: inherit; color: #fff; background: rgba(255, 255, 255, .06); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; outline: none; transition: border-color .2s, box-shadow .2s; resize: vertical; }
.form input:focus, .form textarea:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(63, 208, 240, .2); }

/* footer */
.footer { width: min(1180px, calc(100% - 32px)); margin: 40px auto 20px; padding: 24px 0; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; color: var(--muted); font-size: .85rem; }
.social { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--border); transition: .25s; }
.social:hover { background: #25d366; border-color: #25d366; transform: rotate(12deg) scale(1.1); }

/* botões flutuantes (WhatsApp + Instagram) */
.fab-stack { position: fixed; right: 18px; bottom: 18px; z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.fab { position: relative; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; color: #fff; box-shadow: 0 8px 22px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.35); transition: transform .2s; }
.fab::after { content: ''; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid var(--fc); opacity: 0; animation: fabring 2.6s ease-out infinite; pointer-events: none; }
.fab:hover { transform: scale(1.1) rotate(-6deg); }
.fab.wa { --fc: #25d366; background: linear-gradient(135deg, #34e07f, #139b4f); }
.fab.ig { --fc: #e1306c; width: 46px; height: 46px; background: radial-gradient(circle at 30% 107%, #fdf497 0, #fd5949 45%, #d6249f 62%, #285aeb 92%); }
.fab.ig::after { animation-delay: -1.3s; }
.fab[data-tip]:hover::before { content: attr(data-tip); position: absolute; right: calc(100% + 12px); top: 50%; transform: translateY(-50%); white-space: nowrap; font: 600 .78rem 'Sora', sans-serif; padding: 6px 12px; border-radius: 999px; background: rgba(6,16,48,.95); border: 1px solid var(--border); }
@keyframes fabring { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(1.55); opacity: 0; } }
.socials { display: flex; gap: 10px; }
.social.ig:hover { background: radial-gradient(circle at 30% 107%, #fdf497 0, #fd5949 45%, #d6249f 62%, #285aeb 92%); border-color: transparent; transform: rotate(-12deg) scale(1.1); }

/* página de serviço */
.service-page { width: min(1000px, calc(100% - 32px)); margin: 24px auto 0; }
.service-hero { padding: clamp(24px, 5vw, 56px); }
.service-hero p { color: var(--muted); margin-bottom: 16px; font-size: 1.05rem; }
.big-icon .svc-icon { width: 96px; height: 96px; margin-bottom: 14px; }
.lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; margin: 28px 0; }
.lists h3 { color: var(--cyan); margin-bottom: 10px; font-size: 1rem; }
.lists li { color: var(--muted); padding: 6px 0 6px 22px; position: relative; font-size: .95rem; }
.lists li::before { content: '✦'; position: absolute; left: 0; color: var(--pink); }


/* idioma, logo, itens clicáveis */
.hdr-right { display: flex; align-items: center; gap: 10px; }
.brand-logo { flex: none; filter: drop-shadow(0 0 8px rgba(79,216,255,.6)); transition: transform .4s; }
.brand:hover .brand-logo { transform: rotate(-12deg) translateY(-3px); }
.logo-flame { transform-box: fill-box; transform-origin: top; animation: flame .18s ease-in-out infinite alternate; }
a.stat { cursor: pointer; }
a.stat:hover { border-color: var(--cyan); }
.social.top svg { transform: rotate(-90deg); transition: transform .25s; }
.social.top:hover { background: var(--blue); border-color: var(--cyan); transform: translateY(-4px); }
a.client { cursor: pointer; }
.info-list a, .contact-info a { cursor: pointer; }


/* equipe / avatares (sem cards, com balões) */
.team { display: flex; flex-direction: column; max-width: 920px; margin: 0 auto; padding-top: 10px; }
.member { display: flex; align-items: center; gap: 22px; max-width: 640px; align-self: flex-start; }
.member:nth-child(2) { align-self: flex-end; flex-direction: row-reverse; margin-top: -6px; }
.member:nth-child(3) { margin-top: -6px; }
.av-wrap { position: relative; width: 190px; flex: none; }
.av-wrap::before { content: ''; position: absolute; left: 50%; bottom: 4px; width: 150px; height: 150px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(circle at 50% 35%, rgba(92,200,255,.55), rgba(47,107,255,.25) 60%, transparent 72%); box-shadow: 0 0 40px rgba(79,140,255,.45); transition: transform .35s; }
.avatar { position: relative; width: 100%; height: auto; display: block; overflow: visible; }
.av { animation: bob 3.4s ease-in-out infinite; transform-origin: 80px 180px; transition: transform .3s; }
.member:nth-child(2) .av { animation-delay: -1.1s; } .member:nth-child(3) .av { animation-delay: -2.2s; }
@keyframes bob { 50% { transform: translateY(-5px) rotate(1.5deg); } }
.av-eye { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
.chip { position: absolute; top: 8px; right: 0; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: rgba(20, 50, 125, .75); border: 1px solid var(--border); box-shadow: 0 6px 18px rgba(0,0,0,.4); animation: bob 2.6s ease-in-out infinite; }
.chip .svc-icon { width: 26px; height: 26px; margin: 0; }
.bubble { position: relative; flex: 1; padding: 18px 22px; border-radius: 22px; background: rgba(22, 52, 125, .72); border: 1px solid var(--border); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 10px 34px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.15); transition: border-color .3s, transform .3s; }
.bubble::before { content: ''; position: absolute; left: -9px; top: 50%; width: 16px; height: 16px; margin-top: -8px; transform: rotate(45deg); background: rgba(22, 52, 125, .95); border-left: 1px solid var(--border); border-bottom: 1px solid var(--border); border-radius: 0 0 0 4px; }
.member:nth-child(2) .bubble::before { left: auto; right: -9px; transform: rotate(225deg); }
.bubble h3 { font-size: 1.02rem; margin-bottom: 4px; }

/* ---------- foguete clicável ---------- */
const rocket = $('#rocket');

/* ---------- menu mobile ---------- */
const nav = $('#nav'), burger = $('#burger');
const closeMenu = () => { nav.classList.remove('open'); burger.classList.remove('on'); burger.setAttribute('aria-expanded', 'false'); };

/* ---------- formulário → WhatsApp ---------- */
$('#contact-form').addEventListener('submit', e => {

  window.open(WHATSAPP + '?text=' + encodeURIComponent(t), '_blank', 'noopener');
});

/* ---------- roteador por hash ---------- */
function servicePage(s0) {
  const s = sv(s0);
  const lists = (s.lists || []).map(l => `<div><h3>${l.title}</h3><ul>${l.items.map(i => `<li>${i}</li>`).join('')}</ul></div>`).join('');
  const others = services.filter(x => x.slug !== s.slug).slice(0, 4).map(sv).map(o =>
    `<a href="#/servico/${o.slug}" class="glass card">${ICONS[o.icon]}<h3>${o.title}</h3></a>`).join('');
  return `
  <div class="glass service-hero">
    <div class="big-icon">${ICONS[s.icon]}</div>
    <h1 class="grad-title">${s.title}</h1>
    ${s.paragraphs.map(p => `<p>${p}</p>`).join('')}
    ${lists ? `<div class="lists">${lists}</div>` : ''}
    <div class="hero-actions">
      <a class="btn" href="${WHATSAPP}?text=${encodeURIComponent('Olá! Tenho interesse em ' + s.title)}" target="_blank" rel="noreferrer">${small.whats(20)} ${t('quote')}</a>
      <a class="btn btn-ghost" href="#nossosservicos">${t('back')}</a>
    </div>
  </div>
  <h2 class="grad-title center small">${t('others')}</h2>
  <div class="grid g4">${others}</div>`;
}
function route(keep) {
  const h = location.hash;
  const m = h.match(/^#\/servico\/(.+)$/);
  const s = m && services.find(x => x.slug === m[1]);
  $('#home').hidden = !!m;
  $('#service-view').hidden = !m;
  if (m) {
    $('#service-view').innerHTML = s ? servicePage(s) : `<h2 class="grad-title">${t('nf')}</h2><a class="btn" href="#nossosservicos">${t('back')}</a>`;
    if (!keep) window.scrollTo(0, 0);
  } else if (!keep && h && h.length > 1) {
    setTimeout(() => document.getElementById(h.slice(1))?.scrollIntoView({ behavior: 'smooth' }), 50);
  }
}
window.addEventListener('hashchange', () => route());

function applyLang(keep) {
  document.documentElement.lang = { pt: 'pt-BR', en: 'en', es: 'es' }[lang];
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-ph]').forEach(el => { el.placeholder = t(el.dataset.ph); });
  document.querySelectorAll('.social.top').forEach(el => el.setAttribute('aria-label', t('top')));
  $('#lang-cur').textContent = lang.toUpperCase();
  document.querySelectorAll('#lang-menu li').forEach(li => { const on = li.dataset.lang === lang; li.classList.toggle('active', on); li.setAttribute('aria-selected', on); });
  document.title = t('doc_title');
  document.querySelector('meta[name=description]').content = t('doc_desc');
  renderServices(); renderClients(); renderTeam(); route(keep);
}
const langBtn = $('#lang-btn'), langMenu = $('#lang-menu');
const setMenu = o => { langMenu.classList.toggle('open', o); langBtn.setAttribute('aria-expanded', o); };
langBtn.addEventListener('click', e => { e.stopPropagation(); setMenu(!langMenu.classList.contains('open')); });
langMenu.addEventListener('click', e => {
  const li = e.target.closest('li'); if (!li) return;
  lang = li.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch (err) {}
  setMenu(false); applyLang(true);
});
document.addEventListener('click', () => setMenu(false));
document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });
applyLang(false);

/* abertura */
(() => {
  const intro = $('#intro');
  if (!intro) return;
  $('#intro-rocket').innerHTML = small.logo(120);
  intro.addEventListener('animationend', e => { if (e.animationName === 'introOut') intro.remove(); });
  setTimeout(() => intro.remove(), 4000);
})();
/* ---------- profundidade: parallax, tilt 3D e reveal ---------- */
(() => {
  const root = document.documentElement, stage = $('#stage');
  const fine = matchMedia('(hover: hover)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (fine) {
    let cur = null;
    document.addEventListener('pointermove', e => {
      const nx = e.clientX / innerWidth * 2 - 1, ny = e.clientY / innerHeight * 2 - 1;
      root.style.setProperty('--mx', nx.toFixed(3)); root.style.setProperty('--my', ny.toFixed(3));
      if (stage) { stage.style.setProperty('--rx', (-ny * 9).toFixed(2) + 'deg'); stage.style.setProperty('--ry', (nx * 14).toFixed(2) + 'deg'); }
      const el = e.target.closest ? e.target.closest('.card,.stat,.bubble,.form,.about-card') : null;
      if (cur && cur !== el) ['--tx', '--ty'].forEach(p => cur.style.removeProperty(p));
      if (el) {
        const r = el.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
        el.style.setProperty('--tx', ((.5 - py) * 10).toFixed(2) + 'deg');
        el.style.setProperty('--ty', ((px - .5) * 12).toFixed(2) + 'deg');
        el.style.setProperty('--gx', (px * 100).toFixed(1) + '%'); el.style.setProperty('--gy', (py * 100).toFixed(1) + '%');
      }
      cur = el;
    });
  }
  window.addEventListener('scroll', () => root.style.setProperty('--sy', scrollY), { passive: true });
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }), { threshold: .08 });
    document.querySelectorAll('#home .section').forEach(s => { s.classList.add('rv'); io.observe(s); });
  }
})();
